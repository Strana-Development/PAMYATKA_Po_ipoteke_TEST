финансирование возможно после окончания льготного периода.\nРазмер cashback’а (равен сумме погашения основного долга по Акции «Правильная ипотека »):\n• Выплата cashback’а за оплаченную комиссию за аккредитив осуществляется по окончании срока\nдействия аккредитива, списывается в счет погашения основного долга при зачислении кредита\n• Первый cashback устанавливается в размере 15% от суммы уплаченной комиссии;\n• Каждый последующий относительно предыдущего индексируется на 0,15 п.п . накопительным\nитогом (прогрессирующая шкала);\n• Банк выступает в качестве налогового агента и удерживает 13% от суммы выплачиваемого\ncashback’а\n\nОсобенности:\n• Акция «Выгодная ипотека с Халвой» не применяется;\n• Частично или полное досрочное погашение кредита только после выдачи кредита;\n• Использование материнского капитала на ЧДП только после выдачи кредита;\n• Возможно использование опции «2 документа», ставка не увеличивается;\n• Застройщик не платит комиссию Банку по программе!"]},{"b":[1],"l":"Совкомбанк","c":["","","от 30 до 32 (вкл.)","","17,49%","","",""]},{"b":[1],"l":"Совкомбанк","c":["","","от 33 до 36 (вкл.)","","16,99%","","",""]},{"b":[1],"l":"Совкомбанк","c":["","","32(вкл.)","","12,49%","","",""]},{"b":[1],"l":"Совкомбанк","c":["","","","","","21,49%  или ключ ставка ЦБ + 5п.п.","",""]},{"b":[1],"l":"Совкомбанк","c":["Поэтапное снижение ставки","от 20,01%","-","","1 год - 21,99%\n2 год- 17,99%\n3 год - 13,99%\nдалее 13,99%","","% ставка для клиента на выдаче 21,99% и ставка снижается ежегодно на 4 п.п., при одновременном соблюдении следующих условий:\n- отсутствие текущей просроченной задолженности по выданному ипотечного кредитному договору со сроком не более 14 календарных дней;\n- наличие действующего полиса имущественного страхования.\nПри несоблюдении условий % ставка остается на уровне действующей, при этом сохраняется возможность снижения в следующем году (в течение 3 лет с даты выдачи кредита).","КВ 10,3% от суммы кредита"]}],"h":["Программа","ПВ","Срок н е менее 3-х мес. \nИндивидуальный предприниматель: подтвердить доход и занятость выпиской из СФР, загруженной с помощью технологии запроса выписки из СФР Онлайн (кнопка «Госуслуги») ЛИБО  из личного кабинета на сайте Госуслуг, в формате xml. Если ИП подтверждает доход с помощью налоговой декларации, то занятость можно подтвердить  выпиской ЕГРИП в формате PDF-файла, скачав ее с государственного сервиса egrul.nalog.ru.\nСамозанятый: подтвердить доход справкой о состоянии расчётов (доходов) по налогу на профессиональный доход по форме ФНС России (КНД 1122036).\nБез подтверждения дохода: паспорт РФ и второй документ на выбор - водительское удостоверение, СНИЛС, удостоверение личности военнослужащего, удостоверение личности сотрудника федеральных органов власти, военный билет, загранпаспорт.","","Подтвердить трудовую занятость можно, предоставив:\n1.        копию трудовой книжки, заверенную работодателем;\n2.        выписку из трудовой книжки, заверенную работодателем;\n3.        выписку из электронной трудовой книжки;\n4.        справку от работодателя, содержащую сведения о занимаемой должности и стаже работы (сроке службы), или копию договора/контракта с последнего места работы (для физических лиц, в отношении которых законодательством РФ допускается отсутствие трудовой книжки);\n5.        форму СТД-Р и СТД-ПФР только на бумажном носителе (должна соответствовать приказу правительства).","Если в КД один, то и в ДДУ один.\nМожно , чтобы в КД были двое, а ДДУ оформить только на основного","","","","3 НДФЛ \n\nПринимают в учет только те, которые официально декларируют","","Состав взрослых участником менять не можем\nмы можем в допник при переходе с рассрочки на ипотеку, включать только несовершеннолетних в возрасте  до 18 лет, если их не было в ДДУ и возникла потребность их включить.","3 мес","Не запрашивают","Да","","Сбер откажет","","Пока нет рефа со стандарта на СИ","нет","02.03.2026","У нас нет конкретного списка сертификатов, которые мы берём в подтверждение пв \nМы берём все безвозмездные выплаты. \nЗаймы не берём. \n\nОднако, есть сертификаты, которыми по решению уполномоченного органа можно только гасить ипотеку, несмотря на то, что нет займа. \nЛучше дополнительно проконсультироваться в органе, выдавшем сертификат","Переход с рассрочки на ипотеку, где нужно, чтобы в ДДУ остался один заемщик: \nМожно в банках: ВТБ, Дом рф, Металл, Абсолют.\nНельзя: Альфа, Уралсиб"]},{"b":[3],"l":"ВТБ","c":["Зп клиент - только паспорт\nЗп клиент другого Банка:\n- для подтверждения дохода — справка о доходах (2-НДФЛ), выписка с зарплатного счета или справка по форме банка;\n- чтобы подтвердить свою занятость — копию трудовой книжки, заверенную работодателем, или выписку из Пенсионного фонда.\nБез подтверждения дохода - паспорт и СНИЛС/ИНН\nДля ИП один из документов:\n- Копия налоговой декларации по налогу на доходы физических лиц минимум за 1 год (форма 3-НДФЛ)\n- Копия налоговой декларации по налогу, уплачиваемому в связи с применением упрощенной системы налогообложения минимум за 1 год\nАдвокаты, нотариусы один из документов:\n- Копия налоговой декларации по налогу на доходы физических лиц минимум за 1 год (форма 3-НДФЛ)\n- Копия налоговой декларации по налогу, уплачиваемому в связи с применением упрощенной системы налогообложения минимум за 1 год\nСамозанятый -  для подтверждения дохода предоставляет согласие на получение данных из ФНС.\n1. Если клиент зарегистрирован как самозанятый через ВТБ - дополнительные согласия не требуются\n2. Если клиент зарегистрирован как самозанятый в стороннем банке -предоставить согласия можно одним из способов:\n- в личном кабинете ВТБ Онлайн зайти в раздел «Бизнес и самозанятость» > «Самозанятость» > «Подтвердить права для ВТБ» > ввести СМС-код;\n- в приложении для самозанятых «Мой налог» перейти в раздел «Прочее» > «Партнеры» > выбрать «Банк ВТБ» > нажать «Разрешить»\nЛибо самозанятый может предоставить документ о доходах и трудоустройстве собственноручно, выгрузив из личного кабинета ИФНС в формате .pdf: ислении дивидендов, платежное поручение подтверждающие перевод дивидендов    или  3 НДФЛ  \n* При необходимости могут быть запрошены дополнительные документы\n\nТребования к ИП:\n\nСрок осуществления деятельности в качестве ИП - не менее 2 лет с даты гос. Регистрации \n\n 1. Налоговые декларации ( за прошедший отчетный период 1 год)\nНалоговая декларация о доходах физ лица 3-НДФЛ (с отметками о принятии налоговым органом или документами, подтверждающими отправку данной декларации в налоговый орган), \nИли\nНалоговая декларация по единому налогу, уплачиваемому в связи с применением упрощенной системы налогообложения и платежные документы об оплате налога ( с отметками о принятии налоговым органом или документами, подтверждающими отправку данной декларации в налоговый орган)\n 2. Справки из банков об оборотах по расчетным счетам и /или книга учета и расходов (КУДиР)зарегистрированная в налоговом органе.\nДополнительные документы:\n ⁃ свидетельство о регистрации ИП / свидетельство о внесении записи об ИП в ЕГРИП / лист записи ЕГРИП;\n ⁃ Справка ФНС о действующих расчетных счетах ИП в банках","","","ОСновной заемщик может быть без дохода, если у созаемщика доход подтвержден","","","","","","Нет","Военка 90 дней ,гражданка 60 дней","","","","","","Рефинансирование на СИ нет","","","",""]},{"b":[19],"l":"РоссельхозБанк","c":["1. Банк напрямую запрашивает СФР у клиента\n2. Справка по форме банка + трудовая\n3. 2-ндфл и трудовая\nС договором ГПХ не работают\nСправка по форме  Сбера подойдет \nРаботают с ИП только по упрощенке, из документов только налоговая декларация","","С договором ГПХ не работают","","","","Электронные сведения о трудовой деятельности в формате ПДФ + XML\nСправки 2 Ндфл , либо по форме банка ( можно сбер ) \nВыписка по зп счету","","","Нет","90 дней","","","","","","","","","",""]},{"b":[17],"l":"МТС","c":["","","","","","","","","","","60 дней","","","","","","","","","",""]},{"b":[18],"l":"УБРиР","c":["ПФР на почту банка oos@ubrr.ru либо полный пакет  const filt=S.q||S.sel.size;let h='',tot=0,ns=0;
 if(S.sec<0&&!filt){h=`<div class="hint">Введите слово в поиск, выберите один или несколько банков — или откройте раздел ниже. Примеры: `+['самозанятый','маткап','СВО','ИП','нерезидент','страхование','аккредитив'].map(w=>`<button class="chip" data-q="${w}">${w}</button>`).join('')+'</div>';
  let g='';D.secs.forEach((s,i)=>{if(s.g!==g){g=s.g;h+=(i?'</div>':'')+`<div class="gh">${esc(g)}</div><div class="tiles">`}
   h+=`<button class="tile" data-s="${i}"><b>${esc(s.t)}</b><span>${s.blocks.reduce((a,b)=>a+b.rows.length,0)} записей</span></button>`});h+='</div>'}
 else{const list=S.sec<0?D.secs.map((_,i)=>i):[S.sec];
  list.forEach(i=>{const r=renderSec(i,S.sec>=0);if(!r.n)return;tot+=r.n;ns++;
   h+=`<h2>${esc(D.secs[i].t)}<span>${S.sec<0?`<a data-s="${i}">${r.n} · открыть →</a>`:''}</span></h2>`+r.html});
  h=(S.sec>=0?`<div class="gh">${esc(D.secs[S.sec].g)}</div>`:'')+(h?`<div class="sum">Найдено записей: ${tot}${S.sec<0?` · разделов: ${ns}`:''}</div>`+h:'<div class="empty">Ничего не найдено.<br>Попробуйте другое слово или снимите выбор банков.</div>')}
 app.innerHTML=h}
const sel=$('#sec');sel.innerHTML='<option value="-1">Все разделы</option>';let og=null,gg='';
D.secs.forEach((s,i)=>{if(s.g!==gg){gg=s.g;og=document.createElement('optgroup');og.label=gg;sel.appendChild(og)}og.insertAdjacentHTML('beforeend',`<option value="${i}">${esc(s.t)}</option>`)});
$('#bk').innerHTML='<button class="chip on" data-b="-1">Все банки</button>'+D.banks.map((b,i)=>`<button class="chip" data-b="${i}">${esc(b)}</button>`).join('');
function chips(){document.querySelectorAll('#bk .chip').forEach(c=>c.classList.toggle('on',c.dataset.b==='-1'?!S.sel.size:S.sel.has(+c.dataset.b)))}
function go(){S.lim={};chips();sel.value=S.sec;render()}
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim();S.lim={};render()});
$('#qx').onclick=()=>{$('#q').value='';S.q='';go()};
sel.onchange=()=>{S.sec=+sel.value;go();scrollTo(0,0)};
document.addEventListener('click',e=>{const t=e.target.closest('[data-b],[data-s],[data-q],[data-k],.clamp');if(!t)return;
 if(t.classList.contains('clamp')){t.classList.remove('clamp');return}
 if(t.dataset.b!==undefined){const b=+t.dataset.b;if(b<0)S.sel.clear();else S.sel.has(b)?S.sel.delete(b):S.sel.add(b);go()}
 else if(t.dataset.s!==undefined){S.sec=+t.dataset.s;go();scrollTo(0,0)}
 else if(t.dataset.q!==undefined){$('#q').value=S.q=t.dataset.q;go()}
 else if(t.dataset.k){S.lim[t.dataset.k]=(S.lim[t.dataset.k]||40)+60;render()}});
render();
</script></body></html>
